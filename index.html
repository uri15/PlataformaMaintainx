<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLATAFORMA PARK CMMS — PlataformaPark</title>
  
  <!-- Plataforma PARK Favicon -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=1" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png?v=1" />
  <link rel="shortcut icon" href="./favicon.ico?v=1" />
  <link rel="apple-touch-icon" href="./favicon.png?v=1" />
  
  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- jsPDF & jsPDF-AutoTable CDN for MaintainX PDF Reports -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="./src/styles/main.css" />
</head>
<body class="bg-[#F8FAFC] text-slate-900 antialiased font-sans selection:bg-[#8CC63F] selection:text-white">
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      document.body.innerHTML = '<div style="padding:20px;background:#fee;color:red;z-index:9999;position:relative;">' +
        '<h2>Error de JavaScript Capturado</h2>' +
        '<p><strong>Mensaje:</strong> ' + message + '</p>' +
        '<pre>' + (error && error.stack ? error.stack : '') + '</pre></div>';
      return false;
    };
    window.addEventListener("unhandledrejection", function(event) {
      document.body.innerHTML = '<div style="padding:20px;background:#fee;color:red;z-index:9999;position:relative;">' +
        '<h2>Error de Promesa (Unhandled Promise Rejection)</h2>' +
        '<pre>' + (event.reason && event.reason.stack ? event.reason.stack : event.reason) + '</pre></div>';
    });
  </script>
  <div id="root"></div>

  <!-- Bundle Precompilado Modular con esbuild (<30ms de carga sin Babel) -->
  <script src="./dist/bundle.js?v=29"></script>

</body>
</html>
